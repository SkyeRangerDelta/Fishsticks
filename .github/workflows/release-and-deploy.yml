name: Release & Deploy

on:
  push:
    branches: [ "master", "Experimental" ]

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'Experimental'

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "SkyeRangerDelta/Fishsticks"

jobs:
  release:

    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic-release.outputs.published }}
      version: ${{ steps.semantic-release.outputs.version }}
      tag: ${{ steps.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node version is sourced from package.json "engines.node"
      - name: Use Node.js (package.json engines)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-devbuild-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-devbuild-${{ env.cache-name }}-

      - name: Install Dependencies
        run: npm ci

      # Exposes `published` (and `version`/`tag` when true) as step outputs
      - name: Build Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMRELEASE_REPO }}
          NPM_TOKEN: ${{ secrets.SEMRELEASE_NPM }}
        run: node .github/scripts/semantic-release.mjs


  merge-to-experimental:

    runs-on: ubuntu-latest
    needs:
      - release
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SEMRELEASE_REPO }}

      - name: Configure git
        run: |
          git config user.name "SkyeRangerDelta"
          git config user.email "skyerangerdelta@pldyn.net"

      - name: Merge master into Experimental
        run: |
          git fetch origin Experimental
          git checkout Experimental
          # The chore(sync) scope is hidden from release notes in .releaserc.json
          git merge origin/master -m "chore(sync): Merge master changes into Experimental [skip ci]"
          git push origin Experimental

  deploy:

    runs-on: ubuntu-latest
    needs:
      - release
    # Only build/deploy an image when semantic-release actually published a release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Resolve the Node major version from package.json "engines.node" (e.g. "^26" -> "26")
      - name: Resolve Node version
        id: node
        run: |
          NODE_MAJOR=$(jq -r '.engines.node' package.json | grep -oE '[0-9]+' | head -n1)
          if [ -z "$NODE_MAJOR" ]; then
            echo "::error::Unable to resolve a Node major version from package.json engines.node"
            exit 1
          fi
          echo "major=$NODE_MAJOR" >> "$GITHUB_OUTPUT"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.2'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4 # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.SEMRELEASE_REPO }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ github.ref == 'refs/heads/Experimental' && 'latest-exp' || 'latest' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
